# Project-scoped Codex settings. Codex reads this file in a TRUSTED repo, walking from the
# project root down to the working directory, and it is the only way to ship the setting below
# with the repo rather than relying on each machine's ~/.codex/config.toml.
#
# AGENTS.md is sized to fit the 32 KiB default on its own — the rules that do not have to be
# inlined live in .agents/skills/ instead. This raised budget is the safety net, not the
# mechanism: a nested AGENTS.md composes on top of the root one, and codex truncates the
# combined project doc saying NOTHING when it does. Anything that pushes the ROOT file over the
# default is a build failure (`pnpm agents:build`), never something to fix by raising this.
project_doc_max_bytes = 200000
